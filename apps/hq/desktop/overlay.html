<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Jarvis overlay</title>
<link rel="stylesheet" href="../web/src/styles/companion.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div class="buddy" data-status="idle" data-connection="offline" hidden>
  <div class="companion__art companion__art--pixel" data-look="arc">
    <div class="companion__orbit"></div>
    <canvas class="companion__sphere" width="144" height="144" aria-hidden="true"></canvas>
    <div class="companion__portrait" aria-hidden="true">
      <span class="companion__portrait-hair"></span>
      <span class="companion__portrait-face"><i></i><i></i></span>
      <span class="companion__portrait-jacket"></span>
    </div>
    <div class="companion__head" aria-hidden="true">
      <div class="companion__face"><i></i><i></i></div>
    </div>
    <div class="companion__hood" aria-hidden="true">
      <div class="companion__hood-face"><i></i><i></i></div>
    </div>
    <div class="companion__pip" aria-hidden="true">
      <span class="companion__pip-antenna"></span>
      <div class="companion__pip-face"><i></i></div>
    </div>
  </div>
</div>
<script src="motion.js"></script>
<script src="sphere.js"></script>
<script src="overlay.js"></script>
</body>
</html>
