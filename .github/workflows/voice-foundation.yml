name: Voice foundation

on:
  pull_request:
    branches: [develop, main, docs/voice-foundation-design]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-voice:
    name: Voice foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: 'python -m pip install --only-binary=:all: -r apps/api/requirements.lock'

      - name: Run backend tests
        run: python -m pytest apps/api

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web
        env:
          HUSKY: 0

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web
